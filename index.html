*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg,#111);font-family:P,system-ui,-apple-system,sans-serif;color:#fff;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 16px);pointer-events:auto;opacity:0;transition:opacity .22s;text-align:center;isolation:isolate}
.scr.on{opacity:1}
.scr.top{justify-content:flex-start}
.dim{background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,.45),rgba(0,0,0,.82))}
.scrim{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 80% 48% at 50% 46%,var(--scrim,rgba(0,0,0,.38)),transparent 78%);pointer-events:none}
/* logo */
.logo{font-weight:700;font-size:clamp(44px,13vw,72px);line-height:.92;letter-spacing:-.025em;background:linear-gradient(180deg,#fff 0%,var(--acc) 55%,var(--acc-d) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35)) drop-shadow(0 12px 26px rgba(0,0,0,.45));animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-.6deg)}}
.sub{font-weight:600;font-size:13px;letter-spacing:.28em;text-transform:uppercase;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.6)}
/* top bar */
.bar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;align-items:center;gap:8px;pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;font-size:15px}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffcc33 45%,#c98a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 10px rgba(255,200,60,.6);display:inline-block;flex:none}
.lvb{width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#8fe3ff,#3a7bff);display:grid;place-items:center;font-size:12px;font-weight:700}
.xp{width:54px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}.xp i{display:block;height:100%;background:#8fe3ff}
.gear{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.38);color:#fff;font-size:19px;display:grid;place-items:center;cursor:pointer}
/* buttons */
.btn{pointer-events:auto;font-family:inherit;font-weight:700;font-size:20px;border:0;border-radius:20px;padding:15px 34px;background:linear-gradient(180deg,#fff 0%,var(--acc) 22%,var(--acc) 70%,var(--acc-d) 100%);color:var(--btnink,#111);box-shadow:0 6px 0 var(--acc-d),0 14px 30px rgba(0,0,0,.4);cursor:pointer;transition:transform .08s;min-width:230px;position:relative}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--acc-d),0 8px 18px rgba(0,0,0,.35)}
.btn.big{font-size:28px;padding:20px 50px;border-radius:26px;animation:pulseb 1.6s ease-in-out infinite}
@keyframes pulseb{50%{transform:scale(1.04)}}
.btn small{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:-2px}
.btn.alt{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16)}
.btn.ad{background:linear-gradient(180deg,#b6ffcf,#2bd46b 30%,#19a650);color:#05240f;box-shadow:0 6px 0 #0f7a39,0 12px 28px rgba(0,0,0,.35)}
.btn.sm{min-width:0;font-size:15px;padding:11px 18px;border-radius:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{pointer-events:auto;cursor:pointer;width:92px;padding:10px 6px 8px;border-radius:18px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-family:inherit;font-weight:700;font-size:12px;position:relative}
.tile b{display:block;font-size:24px;line-height:1.2;margin-bottom:2px}
.badge{position:absolute;top:-6px;right:-4px;background:#ff3d6e;color:#fff;font-size:11px;border-radius:999px;padding:2px 7px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.chip{pointer-events:auto;font-family:inherit;font-weight:600;font-size:13px;border:0;border-radius:999px;padding:10px 16px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.chip.off{opacity:.5}
/* panels */
.panel{width:min(440px,100%);max-height:calc(100% - 80px);overflow:auto;background:linear-gradient(180deg,rgba(30,26,52,.92),rgba(14,12,26,.95));border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:18px 16px;box-shadow:0 24px 60px rgba(0,0,0,.55);-webkit-overflow-scrolling:touch}
.ptitle{font-weight:700;font-size:24px;margin:2px 0 12px}
.x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px;cursor:pointer;pointer-events:auto}
/* level map */
.world{margin:6px 0 16px;border-radius:20px;padding:12px 10px;background:linear-gradient(160deg,var(--wc),rgba(0,0,0,.3));border:1px solid rgba(255,255,255,.12)}
.wname{font-weight:700;font-size:17px;text-align:left;padding:0 6px}.wsub{font-size:12px;opacity:.75;text-align:left;padding:0 6px 8px}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:16px;border:0;font-family:inherit;font-weight:700;font-size:17px;color:#2a1a00;background:linear-gradient(180deg,#fff7d6,var(--acc));box-shadow:0 4px 0 var(--acc-d);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.lv.lock{background:rgba(255,255,255,.08);color:rgba(255,255,255,.35);box-shadow:none;cursor:default}
.lv.cur{outline:3px solid #fff;animation:pulseb 1.2s infinite}
.lv i{font-style:normal;font-size:10px;letter-spacing:-1px;color:#b07a00}
.lv.boss{background:linear-gradient(180deg,#ffd6e6,#ff5c8a);box-shadow:0 4px 0 #a8244d;color:#3a0014}
/* shop */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{border-radius:18px;background:rgba(255,255,255,.06);border:2px solid transparent;padding:8px 6px;cursor:pointer;font-weight:700;font-size:12px}
.item.eq{border-color:var(--acc)}
.item canvas{width:100%;aspect-ratio:1;border-radius:12px;display:block;margin-bottom:6px;background:rgba(0,0,0,.25)}
.price{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;margin-top:3px}.price .coin{width:15px;height:15px}
/* missions */
.mis{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(255,255,255,.06);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.mis .t{flex:1;font-size:14px;font-weight:600}.bar2{height:7px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#8fe3ff,#7dffcf)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.day{border-radius:12px;background:rgba(255,255,255,.07);padding:7px 2px;font-size:10px;font-weight:700}.day.got{background:rgba(125,255,207,.25)}.day.now{outline:2px solid var(--acc)}
.day .coin{width:16px;height:16px;margin:4px auto 2px;display:block}
/* results */
.big{font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1.05;text-shadow:0 6px 24px rgba(0,0,0,.5)}
.stars{display:flex;gap:6px;justify-content:center;margin:4px 0 2px}
.st{width:64px;height:64px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(255,255,255,.18);transform:scale(.2);opacity:0;transition:transform .45s cubic-bezier(.2,1.8,.4,1),opacity .2s}
.st.mid{width:80px;height:80px;margin-top:-14px}
.st.on{background:linear-gradient(180deg,#fff7c2,#ffcc33 55%,#e09a00)}
.st.show{transform:scale(1);opacity:1}
.earn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:26px}
.score{font-weight:700;font-size:76px;line-height:1;text-shadow:0 6px 24px rgba(0,0,0,.4)}
.lbl{font-weight:600;font-size:13px;letter-spacing:.25em;text-transform:uppercase;opacity:.8}
.nb{font-weight:700;font-size:14px;letter-spacing:.15em;background:var(--acc);color:var(--btnink,#111);padding:6px 14px;border-radius:999px;animation:pulseb 1s infinite}
.how{font-size:14px;opacity:.9;max-width:320px;line-height:1.5;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#pz{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font:700 18px P,sans-serif;pointer-events:auto;display:none;cursor:pointer}
#pz.on{display:block}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,20px);background:linear-gradient(180deg,rgba(40,34,70,.95),rgba(20,16,36,.95));border:1px solid rgba(255,255,255,.18);color:#fff;padding:10px 18px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:all .35s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 10px);font-size:10px;opacity:.5;letter-spacing:.15em}
@media (min-width:700px) and (min-height:700px){.scr{zoom:1.3}#pz{zoom:1.3}#toast{zoom:1.3}}

/* v3 motion */
.btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.2s ease-in-out infinite;pointer-events:none;mix-blend-mode:soft-light}
.btn.alt::after,.btn.sm::after{display:none}
@keyframes shine{0%,60%{background-position:130% 0}100%{background-position:-130% 0}}
.scr.on .panel{animation:pop .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}}
.scr.on .tile{animation:rise .5s cubic-bezier(.2,1.3,.4,1) backwards}.scr.on .tile:nth-child(2){animation-delay:.05s}.scr.on .tile:nth-child(3){animation-delay:.1s}.scr.on .tile:nth-child(4){animation-delay:.15s}
